<!DOCTYPE html>
<html xmlns:th="http://www.thymleaf.org">
<head>
<meta http-equiv="Content-type" content="text/html ; charset=UTF-8">

<!--this is for the responsive UI  -->
<meta name="viewport"
	content="width=device-width;initial-scale=1.0, minimum-scale=1.0">

<title>Login Admin Control Panel</title>

<link rel="stylesheet" type="text/css"
	th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />

</head>
<body>
	<div class="container-fluid text-center">
		<div>
			<img alt="" th:src="@{/images/pranshi.png }" width="100">
		</div>

		<form th:action="@{/login}" method="post" style="max-width:350px; margin:0 auto">
			
			<!-- session.SPRING_SECURITY_LAST_EXCEPTION.message this show original message generated by spring security -->
			<div th:if="${param.error}">
			<p class="text-danger">[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]</p>
			</div>
			
			<div class="border border-secondary rounded p-3">
				<p>Access to Pranshi Control panel</p>
				
				<p>
				  <input type="email" name="email" class="form-control" placeholder="E-mail" />
				</p>
				
				<p>
				  <input type="password" name="password" class="form-control" placeholder="Password" />
				</p>
				
				<p>
				  <input type="submit" value="Login" class="btn-primary">
				</p>
			</div>
		</form>

		<div>
			<p>Pranshi Control Panel - copyright &copy; Pranshi</p>
		</div>
	</div>

</body>
</html>
